<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="t d"><title id="t">How long before an answer starts: people, a nearby pipeline, a centralized one</title><desc id="d">A race, slowed down four times. People answer each other within 0 to 300 milliseconds (median, ten languages, Stivers et al. 2009). A voice pipeline on one nearby PolarGrid node answers in 364 milliseconds. Three centralized models take 0.8 to over 1.6 seconds.</desc><style>@font-face{font-family:'mono-500';src:url(data:font/woff;base64,) format('woff');font-weight:500;font-style:normal}@font-face{font-family:'mono-400';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}@font-face{font-family:'sans-600';src:url(data:font/woff;base64,) format('woff');font-weight:600;font-style:normal}@media (prefers-reduced-motion: reduce){.mv{display:none}.st{opacity:.5}.fd{opacity:1}}</style><rect width="830" height="300" rx="16" fill="#09090B"/><text x="28.0" y="40.0" font-family="&#x27;mono-500&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#F0569E" text-anchor="start" letter-spacing="1.5">BEFORE THE FIRST WORD</text><text x="802.0" y="40.0" font-family="&#x27;mono-400&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#A1A1AA" text-anchor="end">slowed down 4×</text><path d="M312.4 64V250" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 5"/><text x="312.4" y="60.0" font-family="&#x27;mono-400&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#A1A1AA" text-anchor="middle">300 ms</text><path d="M551.2 64V250" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 5"/><text x="551.2" y="60.0" font-family="&#x27;mono-400&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#A1A1AA" text-anchor="middle">1 second</text><text x="28.0" y="98.0" font-family="&#x27;sans-600&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#FAFAFA" text-anchor="start">People</text><text x="28.0" y="116.0" font-family="&#x27;mono-400&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#A1A1AA" text-anchor="start">median, ten languages</text><rect x="210" y="82" width="102.4" height="22" rx="4" fill="#0F0F12"/><rect x="210" y="82" width="0" height="22" rx="4" fill="#FAFAFA" class="mv"><animate attributeName="width" values="0;102.4;102.4;0" dur="9s" begin="0s" keyTimes="0;0.133;.94;1" repeatCount="indefinite"/></rect><rect x="210" y="82" width="102.4" height="22" rx="4" fill="#FAFAFA" opacity=".35" class="st"/><text x="334.4" y="98.0" font-family="&#x27;mono-500&#x27;, Menlo, Consolas, monospace" font-size="13" fill="#FAFAFA" text-anchor="start">0–300 ms</text><text x="28.0" y="156.0" font-family="&#x27;sans-600&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#FAFAFA" text-anchor="start">Nearby</text><text x="28.0" y="174.0" font-family="&#x27;mono-400&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#A1A1AA" text-anchor="start">one PolarGrid node</text><rect x="210" y="140" width="124.2" height="22" rx="4" fill="#0F0F12"/><rect x="210" y="140" width="0" height="22" rx="4" fill="#E11C79" class="mv"><animate attributeName="width" values="0;124.2;124.2;0" dur="9s" begin="0s" keyTimes="0;0.162;.94;1" repeatCount="indefinite"/></rect><rect x="210" y="140" width="124.2" height="22" rx="4" fill="#E11C79" opacity=".35" class="st"/><text x="356.2" y="156.0" font-family="&#x27;mono-500&#x27;, Menlo, Consolas, monospace" font-size="13" fill="#FDA5D5" text-anchor="start">364 ms</text><text x="28.0" y="214.0" font-family="&#x27;sans-600&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#FAFAFA" text-anchor="start">Centralized</text><text x="28.0" y="232.0" font-family="&#x27;mono-400&#x27;, Menlo, Consolas, monospace" font-size="11" fill="#A1A1AA" text-anchor="start">three cloud models</text><rect x="210" y="198" width="545.9" height="22" rx="4" fill="#0F0F12"/><rect x="210" y="198" width="0" height="22" rx="4" fill="#3F3F46" class="mv"><animate attributeN